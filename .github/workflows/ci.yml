name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85"
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings

  upstream-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check
      - run: cargo test --manifest-path crates/Cargo.toml --workspace --locked
      - run: cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --locked -- -D warnings
      - run: cargo doc --manifest-path crates/Cargo.toml --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  protocol-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify-protocol-pin.sh
