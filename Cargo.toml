[package]
name = "openclaw-node-contract"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Experimental OpenClaw node-contract conformance harness"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
