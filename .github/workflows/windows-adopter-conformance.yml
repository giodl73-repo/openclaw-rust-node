name: Windows adopter conformance

on:
  pull_request:
    paths:
      - .github/workflows/windows-adopter-conformance.yml
      - crates/**
      - test/fixtures/**
      - tests/cross-repo/windows-node/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-adopter:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out shared runtime candidate
        uses: actions/checkout@v4
        with:
          path: rust-node
          fetch-depth: 0

      - name: Check out pinned Windows adopter
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw-windows-node
          ref: 3ca913a43a62957b8aca0448667facff3290fbc6
          path: windows-node

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Run pinned cross-repository conformance
        shell: pwsh
        run: |
          ./rust-node/tests/cross-repo/windows-node/run.ps1 `
            -RustNodeRoot ./rust-node `
            -WindowsNodeRoot ./windows-node
