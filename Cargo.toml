[package]
name = "openclaw-node"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Experimental reusable OpenClaw node client"
license = "MIT"

[dependencies]
base64 = "0.23.0"
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
futures-util = { version = "0.3.33", features = ["sink"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[[bin]]
name = "openclaw-node"
path = "src/bin/openclaw-node.rs"
